name: Тесты и деплой

on:
  push:
    branches: [main]
  pull_request:
  # Кнопка «запустить руками» — выкатить образ без правок кода.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Леджера здесь нет и быть не должно — он в приватном репозитории.
      # Тесты, которым он нужен, сами пропускаются; остальные проверяют
      # импортёры на анонимизированных фикстурах. Сюда же входит
      # tests/test_no_secrets.py: он ищет в репозитории настоящие номера
      # счетов и маски карт, так что утечка не доедет до main незамеченной.
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Зависимости нужны целиком: без них pylint не видит ни beangulp, ни
      # beancount и ругается на каждый импорт, вместо того чтобы проверять код.
      - run: pip install -r requirements-dev.txt

      # Настройки — в pyproject.toml, включая то, что отключено и почему.
      # Список путей повторяет README: линтуется всё, что мы написали сами.
      - run: >
          pylint finance tools tests import.py bot.py fava_import_config.py
          fava_ext.py deploy/entrypoint.py

  deploy:
    # Выкатывается только то, что прошло и тесты, и линтер: деплой идёт сразу
    # в единственную рабочую машину, откатывать оттуда дороже, чем не выкатить.
    needs: [test, lint]
    # Только с main. В pull_request секрета всё равно не видно, и job упал бы.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Два деплоя разом поссорятся за один том, поэтому очередь из одного.
    # cancel-in-progress: false — деплой на середине прерывать нельзя.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only: образ собирается на стороне fly, docker в раннере не нужен.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}