# Образец карты замен для сборки тестовых фикстур.
#
# Настоящий файл называется tools/anonymize.yaml и в репозиторий не попадает:
# слева в нём настоящие имена, номера счетов и маски карт.
#
#     cp tools/anonymize.example.yaml tools/anonymize.yaml
#
# Слева — что встречается в выписке, справа — чем это заменить в фикстуре.
# Разделы отличаются только смыслом, применяются одинаково: сначала более
# длинные строки, чтобы замена номера не разрезала строку подлиннее.
#
# Всё, что похоже на идентификатор, но не описано здесь, обрушит сборку
# фикстуры — см. LEAK_RE в tools/anonymize.py. Это сделано намеренно: забытая
# строчка здесь иначе стала бы утечкой в репозиторий.

names:
  Ivan Ivanov: Firstname Lastname
  IVAN IVANOV: FIRSTNAME LASTNAME
  SOME COMPANY LLC: ORGANIZATION ONE

# Свои счета — заглушки на 1000, чужие — на 2000, чтобы различать их глазом.
accounts:
  "000000000000001": "100000000000001"
  "000000000000002": "200000000000001"

# Слева здесь тоже заглушки: настоящую маску карты нельзя записать даже
# в образце — её найдёт tests/test_no_secrets.py и уронит сборку.
cards:
  0000XXXXXXXX1111: 4000XXXXXXXX0001
  0000********2222: "5555********0001"

# Прочие сквозные номера: соцкарты, ИНН и подобное.
numbers:
  "1234567890": "1000000000"