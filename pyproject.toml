# Проект не пакетируется и не ставится через pip — зависимости живут
# в requirements.txt. Здесь только настройки инструментов.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Чтобы `import finance...` работал из тестов без установки пакета.
pythonpath = ["."]
# Бот асинхронный, и его тесты — корутины. В auto-режиме их не нужно
# помечать: у нас нет ни одного асинхронного теста, который был бы не про бота.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ─────────────────────────────── pylint ───────────────────────────────
#
# Запуск: python -m pylint finance tools tests import.py bot.py fava_import_config.py
#         fava_ext.py deploy/entrypoint.py
# То же самое делает CI, см. .github/workflows/ci.yml.

[tool.pylint.main]
# lxml — C-расширение: без разрешения pylint не видит его атрибутов и ругается
# на каждое обращение, хотя ничего про них не знает.
extension-pkg-allow-list = ["lxml"]

[tool.pylint."messages control"]
disable = [
    # Фикстура pytest приходит в тест одноимённым аргументом — это не ошибка,
    # а весь способ, которым фикстуры работают. Иначе проверка даёт 130+
    # срабатываний, и в них тонет всё остальное.
    "redefined-outer-name",
    # Тесты импортёров похожи друг на друга неизбежно: у банков одни и те же
    # вопросы (опознал ли файл, сошлись ли суммы, поймал ли дубликаты),
    # и сходство здесь — свойство задачи, а не недосмотр.
    "duplicate-code",
    # Импорт внутри функции — способ не тащить зависимость в модуль ради одной
    # проверки. В боевом коде такого нет, только в тестах и сборщиках фикстур.
    "import-outside-toplevel",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# Короткая очевидная функция докстринга не требует: `def failed(self)` в две
# строки объясняет себя именем. Всё, что длиннее, — объясняет уже не только
# себя, и без докстринга читателю придётся его восстанавливать.
docstring-min-length = 10

[tool.pylint.design]
# Потолки, а не цели: подняты чуть выше самого сложного, что в коде есть
# сегодня, чтобы ловить рост, а не existing-код. Кто их превысит — пусть
# объяснится в ревью.
max-args = 10
max-attributes = 12
max-locals = 18
max-branches = 20
# Класс с одним публичным методом — нормальный сценарий: AddCommand.run(),
# Anonymizer.apply(). Двух требовать не за что.
min-public-methods = 1