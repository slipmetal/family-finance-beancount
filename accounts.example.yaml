# Образец списка счетов. Номера здесь вымышленные.
#
# Настоящий файл называется accounts.yaml и лежит рядом с леджером —
# в приватном репозитории, а не здесь: номера счетов это личные данные.
# Путь по умолчанию — ledger/accounts.yaml, переопределяется переменной
# окружения FINANCE_ACCOUNTS.
#
#     cp accounts.example.yaml ledger/accounts.yaml
#
# Обязательные поля у каждой записи: bank, account, currency.
# Дальше зависит от банка:
#
#   bank: ameria        marker — метка в имени файла КАРТОЧНОЙ выписки.
#                       В ней нет ни номера счёта, ни номера карты, различить
#                       счета можно только по имени файла.
#
#   bank: ameria-account  marker и number — выписка по счёту (в том числе
#                       сберегательному). Формат у неё другой, чем у карточной:
#                       раздельные Credit/Debit и номер счёта контрагента.
#                       Метка нужна по той же причине — номера счёта в файле
#                       нет; номер перепроверяет метку по хвосту, который банк
#                       печатает в описании начисленных процентов.
#
#   bank: acba-card     number — номер карточного счёта. Читается из .xls:
#                       только там есть название мерчанта.
#
#   bank: acba-account  number — номер обычного счёта. Читается из .xml:
#                       только там есть контрагент и номер операции.
#
#   bank: tbank         number — номер лицевого счёта, двадцать цифр. Тот же,
#                       что в шапке «Справки о движении средств». Формат
#                       выписки — PDF, другого банк не даёт.
#
#   bank: sber          number — номер счёта, двадцать цифр, только цифры.
#                       В самой выписке он напечатан группами через пробел
#                       («10000 000 0 0000 0000003»), импортёр их убирает.
#                       Формат — тоже PDF.
#
# Номер счёта у ACBA, Т-Банка и Сбербанка лежит внутри самого файла, поэтому
# раскладывать их выписки по папкам и метить имя файла не нужно — импортёр
# находит своё сам.
#
# Валюта перепроверяется по содержимому файла: если метка или номер указывают
# на счёт с другой валютой, файл не опознается — вместо того чтобы молча уехать
# не на тот счёт.

accounts:

  - bank: ameria
    account: Assets:Ameria:Card0001
    currency: AMD
    marker: card0001

  - bank: ameria
    account: Assets:Ameria:Rub
    currency: RUB
    marker: rub

  - bank: acba-card
    account: Assets:Acba:AmdCard
    currency: AMD
    number: "100000000000001"

  - bank: acba-account
    account: Assets:Acba:Amd
    currency: AMD
    number: "100000000000002"

  # Следующая пара стоит здесь ради теста на уникальность имён импортёров:
  # плоский счёт и вложенный, у которых СОВПАДАЕТ последний сегмент («Usd»).
  #
  # Имя импортёра раньше строилось из этого сегмента, и такая пара давала два
  # одинаковых имени — fava отказывалась загружать конфиг импорта с ошибкой
  # «Duplicate importer name found». В образце тогда были только плоские счета
  # с разными валютами, поэтому тест этого не ловил. Не убирайте одну из двух:
  # поодиночке они столкновения не воспроизводят.
  - bank: acba-account
    account: Assets:Acba:Usd
    currency: USD
    number: "100000000000003"

  - bank: acba-account
    account: Assets:Acba:SoleProprietor:Usd
    currency: USD
    number: "100000000000004"

  - bank: tbank
    account: Assets:Tbank:Rub
    currency: RUB
    number: "10000000000000000001"

  - bank: sber
    account: Assets:Sber:Rub
    currency: RUB
    number: "10000000000000000003"
  - bank: ameria-account
    account: Assets:Ameria:Usd
    currency: USD
    marker: usd
    number: "1000053294282901"
